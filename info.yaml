# Tiny Tapeout project information

project:
  title: "TinyRV32"
  author: "Avyukth-ma"
  discord: ""
  description: "A compact single-cycle RV32I processor."
  language: "Verilog"
  clock_hz: 0

  # How many tiles your design occupies?
  tiles: "1x1"

  # Top module name
  top_module: "tt_um_avyukth_tinyrv32"

  # List of source files
  source_files:
    - "project.v"


# The pinout of your project.
pinout:

  # Inputs
  ui[0]: "Register Select Bit 0"
  ui[1]: "Register Select Bit 1"
  ui[2]: "Register Select Bit 2"
  ui[3]: "Register Select Bit 3"  
  ui[4]: "Unused"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs
  uo[0]: "Register Data Bit 0"
  uo[1]: "Register Data Bit 1"
  uo[2]: "Register Data Bit 2"
  uo[3]: "Register Data Bit 3"
  uo[4]: "Register Data Bit 4"
  uo[5]: "Register Data Bit 5"
  uo[6]: "Register Data Bit 6"
  uo[7]: "Register Data Bit 7"

  # Bidirectional pins
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"


# Do not change!
yaml_version: 6
