# Tiny Tapeout project information
project:
  title:        "4-bit ALU"
  author:       "Avyukth-ma"
  discord:      ""
  description:  "A combinational 4-bit arithmetic and logic unit supporting eight operations."
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Top module name
  top_module:  "tt_um_avyukth_alu"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "B0"
  ui[5]: "B1"
  ui[6]: "B2"
  ui[7]: "B3"

  # Outputs
  uo[0]: "Y0"
  uo[1]: "Y1"
  uo[2]: "Y2"
  uo[3]: "Y3"
  uo[4]: "Carry"
  uo[5]: "Zero"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # Bidirectional pins
  uio[0]: "OP0"
  uio[1]: "OP1"
  uio[2]: "OP2"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
